<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake-Game | Sapola</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <section>
            <div class="infos">
                <div class="info">
                    <h3>High: <span id="high-score">0</span></h3>
                </div>
                <div class="info">
                    <h3>Score: <span id="score">0</span></h3>
                </div>
                <div class="info">
                    <h3>Time: <span id="time">00:00</span></h3>
                </div>
            </div>

            <div class="board"></div>

            <div class="mobile-controls">
                <button class="ctrl-btn up" id="ctrl-up">▲</button>
                <button class="ctrl-btn left" id="ctrl-left">◀</button>
                <button class="ctrl-btn right" id="ctrl-right">▶</button>
                <button class="ctrl-btn down" id="ctrl-down">▼</button>
            </div>
        </section>
    </main>

    <div class="developer-credits">
        <p>Made with 💜 by <strong>Adityapratap Singh</strong></p>
        <div class="credit-links">
            <a href="https://github.com/adityapratap108" target="_blank" class="btn-link">GitHub</a>
            <a href="mailto:adityapratapsingh1008@gmail.com" class="btn btn-touch">Get in Touch</a>
        </div>
    </div>

    <div class="modal">
        <div class="start-game">
            <h3>Welcome to Sapola</h3>
            <button class="btn btn-start">Start Game</button>
        </div>
        <div class="game-over">
            <h3>Game Over</h3>
            <button class="btn btn-restart">Restart Game</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
